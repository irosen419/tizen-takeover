<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Hub</title>
  <script>
    /*
     * Stylesheets that arrive broken. Every file comes through TizenBrew's
     * proxy, one fetch each, and now and then a fetch fails or is cut short.
     * A page without one stylesheet still runs but draws that widget
     * unstyled (seen with weather.css: giant icons, no forecast). So: a
     * stylesheet that fails, comes back empty or lacks its closing
     * ".css-end" rule is fetched again, up to three more times.
     * window.HUB_STYLES.status() says what happened, for the About panel.
     */
    (function () {
      var MAX = 3;
      var tries = {};      // file -> fetches made after the first
      var fixed = {};      // file -> true once a later fetch was whole
      var lost = {};       // file -> true when every fetch failed
      function fileOf(link) {
        var h = String(link.getAttribute('data-file') || link.getAttribute('href') || '');
        return h.split('?')[0];
      }
      function whole(link) {
        try {
          var rules = link.sheet && link.sheet.cssRules;
          if (!rules || !rules.length) return false;
          return rules[rules.length - 1].selectorText === '.css-end';
        } catch (e) { return true; }   // can't look inside: trust the load
      }
      function again(link) {
        var file = fileOf(link);
        if (link.getAttribute('data-gone')) return;
        var n = tries[file] || 0;
        if (n >= MAX) { lost[file] = true; return; }
        tries[file] = n + 1;
        link.setAttribute('data-gone', '1');
        setTimeout(function () {
          var next = document.createElement('link');
          next.rel = 'stylesheet';
          next.setAttribute('data-file', file);
          // The first retry asks for the same address; later ones a new one,
          // in case a failed answer was kept somewhere on the way.
          next.href = n === 0 ? file : file + '?retry=' + n;
          // Same place in the order, so later sheets still win over it.
          if (link.parentNode) link.parentNode.replaceChild(next, link);
          else document.getElementsByTagName('head')[0].appendChild(next);
        }, 300 + n * 900);
      }
      function check(link) {
        var file = fileOf(link);
        if (whole(link)) { if (tries[file]) fixed[file] = true; }
        else again(link);
      }
      // Capture phase: a stylesheet's load and error don't bubble.
      function isSheet(t) {
        return !!t && !!t.tagName && String(t.tagName).toUpperCase() === 'LINK' &&
          String(t.rel).toLowerCase() === 'stylesheet';
      }
      document.addEventListener('load', function (e) { if (isSheet(e.target)) check(e.target); }, true);
      document.addEventListener('error', function (e) { if (isSheet(e.target)) again(e.target); }, true);
      window.HUB_STYLES = {
        status: function () {
          var bad = [], ok = [], f;
          for (f in lost) if (lost.hasOwnProperty(f) && !fixed[f]) bad.push(f);
          for (f in fixed) if (fixed.hasOwnProperty(f)) ok.push(f);
          if (bad.length) return bad.join(', ') + ' did not load';
          if (ok.length) return ok.join(', ') + ' loaded on a later try';
          return '';
        }
      };
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="widgets/today.css">
  <link rel="stylesheet" href="widgets/todo.css">
  <link rel="stylesheet" href="widgets/weather.css">
  <link rel="stylesheet" href="widgets/calendar.css">
  <link rel="stylesheet" href="widgets/nowplaying.css">
  <link rel="stylesheet" href="widgets/awws.css">
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <main class="stage" id="stage">
    <div class="grid" id="grid"></div>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="ghost" id="ghost"></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true"></section>

  <section class="frame-wrap" id="frameWrap" hidden>
    <iframe id="frame" title="Dashboard"></iframe>
    <div class="frame-hint">Back to return</div>
  </section>

  <aside class="switcher" id="switcher" role="menu" aria-label="Layouts"></aside>
  <aside class="about" id="about" aria-label="About this hub"></aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="update.js"></script>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="logos.js"></script>
  <script src="widgets/today.js"></script>
  <script src="widgets/entertainment.js"></script>
  <script src="widgets/todo.js"></script>
  <script src="widgets/weather.js"></script>
  <script src="widgets/calendar.js"></script>
  <script src="widgets/nowplaying-viz.js"></script>
  <script src="widgets/nowplaying.js"></script>
  <script src="widgets/awws.js"></script>
  <script src="widgets/planned.js"></script>
  <script src="live.js"></script>
  <script src="clay.js"></script>
  <script src="hub.js"></script>
</body>
</html>
