<!DOCTYPE html>
<html lang="en" data-boot>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The last resort: if update.js never loads or stops, open this branch's hub. -->
  <meta http-equiv="refresh" content="15;url=hub.html">
  <title>Home Hub</title>
  <!--
    The page TizenBrew opens. It finds the newest commit of this branch and
    moves on to that commit's hub.html (see app/update.js). Keep it small and
    stable: it comes through jsDelivr's 12-hour branch cache.
  -->
  <style>
    html { font-size: calc(100vw / 80); background: #050506; }
    body {
      margin: 0;
      background: #050506;
      color: #a4a8b3;
      font-family: "SamsungOne", "Samsung Sans", "Helvetica Neue", Arial, sans-serif;
    }
    .wait {
      position: absolute;
      top: 50%; left: 0;
      width: 100%;
      margin-top: -0.9rem;
      padding: 0 2rem;
      box-sizing: border-box;
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      -webkit-animation: wait-in 0.6s ease 1.2s forwards;
      animation: wait-in 0.6s ease 1.2s forwards;
    }
    @-webkit-keyframes wait-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes wait-in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="wait">Getting the newest version…</div>
  <script src="update.js"></script>
</body>
</html>
